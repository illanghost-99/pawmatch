name: pawmatch
description: Sveriges sociala app för hundägare.
publish_to: "none"
version: 1.0.0+45

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  geolocator: ^13.0.2
  supabase_flutter: ^2.8.4
  uuid: ^4.5.1
  url_launcher: ^6.3.1
  local_auth: ^2.3.0
  image_picker: ^1.1.2
  shared_preferences: ^2.5.3
  sign_in_with_apple: ^6.1.4
  flutter_local_notifications: ^18.0.1
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.6
  in_app_purchase: ^3.2.3
  google_mlkit_image_labeling: ^0.16.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
